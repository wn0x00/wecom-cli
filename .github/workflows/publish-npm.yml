name: Build and publish custom-endpoint npm packages

on:
  pull_request:
    paths:
      - ".github/workflows/publish-npm.yml"
      - "scripts/prepare-npm-release.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
  workflow_dispatch:
  push:
    branches:
      - npm-release

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NPM_SCOPE: "@guanzhu.me"
  NPM_PACKAGE_BASENAME: "wecom-cli"
  NPM_BUILD_REVISION: "1"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/wecom-cli
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: target/aarch64-unknown-linux-gnu/release/wecom-cli
          - platform: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/wecom-cli
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/wecom-cli
          - platform: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/wecom-cli.exe

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust target
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build with custom-endpoint enabled
        shell: bash
        run: cargo build --locked --release -p wecom-cli --target "${{ matrix.target }}" --features custom-endpoint

      - name: Stage Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifact
          cp "${{ matrix.binary }}" artifact/wecom-cli
          chmod +x artifact/wecom-cli

      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item "${{ matrix.binary }}" "artifact/wecom-cli.exe"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 7

  prepare:
    name: Verify npm package staging
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all binaries
        uses: actions/download-artifact@v7
        with:
          pattern: binary-*
          path: .release/artifacts

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Prepare npm packages
        run: node scripts/prepare-npm-release.mjs

      - name: Verify root CLI entry survives npm normalization
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack .release/npm/root --silent)"
          tar -xOf "$tarball" package/package.json > packed-package.json
          node -e "const p=require('./packed-package.json'); if (p.bin?.['wecom-cli'] !== 'bin/wecom.js') { console.error('Packed root package lost wecom-cli bin entry:', p.bin); process.exit(1); }"
          rm -f "$tarball" packed-package.json

      - name: Verify package manifests
        shell: bash
        run: |
          set -euo pipefail
          for dir in .release/npm/root .release/npm/*-*; do
            echo "==> $dir"
            npm pack "$dir" --dry-run
          done

      - name: Upload npm staging
        uses: actions/upload-artifact@v7
        with:
          name: npm-staging
          path: .release/npm
          retention-days: 7

  publish:
    name: Publish npm packages
    if: github.event_name != 'pull_request'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download npm staging
        uses: actions/download-artifact@v7
        with:
          name: npm-staging
          path: .release/npm

      - name: Check npm token
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo "Missing repository secret NPM_TOKEN." >&2
            exit 1
          fi

      - name: Publish platform packages, then root package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./.release/npm/root/package.json').version")"
          ROOT_PACKAGE="${NPM_SCOPE}/${NPM_PACKAGE_BASENAME}"

          publish_if_missing() {
            local package_name="$1"
            local package_dir="$2"

            if npm view "${package_name}@${VERSION}" version >/dev/null 2>&1; then
              echo "Skipping ${package_name}@${VERSION}: already published."
            else
              echo "Publishing ${package_name}@${VERSION}..."
              npm publish "${package_dir}" --access public
            fi
          }

          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            publish_if_missing "${ROOT_PACKAGE}-${platform}" ".release/npm/${platform}"
          done

          publish_if_missing "${ROOT_PACKAGE}" ".release/npm/root"
